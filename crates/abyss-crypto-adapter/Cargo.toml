[package]
name = "abyss-crypto-adapter"
version = "0.1.0"
edition = "2021"
description = "Production ed25519 adapter implementing abyss-crypto-api traits"
publish = false

[dependencies]
abyss-crypto-api = { path = "../abyss-crypto-api" }
# "zeroize" is on by default in ed25519-dalek 2.x and is what actually zeroes
# SigningKey on drop; pinned explicitly so a future default-feature change
# upstream can't silently disable it. See src/lib.rs doc comment.
ed25519-dalek = { version = "2", features = ["zeroize"] }
rand = "0.8"
