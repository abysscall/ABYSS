# Cargo deny configuration for ABYSS
# See: https://embarkstudios.github.io/cargo-deny/
#
# NOTE (2026-08): cargo-deny's [advisories] and [licenses] config were
# significantly simplified in PR#611/#681/#753 upstream. Several fields
# that used to take a lint level ("warn"/"deny"/"allow") were removed
# entirely because the corresponding checks are now always-deny-by-default,
# with `ignore`/`allow`/`exceptions` lists as the only way to carve out
# exemptions. See https://github.com/EmbarkStudios/cargo-deny/blob/main/CHANGELOG.md

[advisories]
# The advisories table is used to configure the advisories source.
db-path = "~/.cargo/advisory-db"
# The url(s) of the advisory databases to use. By default the RustSec advisory
# database is used. Optionally add additional sources.
db-urls = ["https://github.com/rustsec/advisory-db/raw/osv/crates/"]
# NOTE: `vulnerability` and `notice` used to be lint-level fields here but
# were removed — vulnerability/unsound/notice advisories are now always
# treated as errors, with `ignore` below as the only exemption mechanism.
# How to handle unmaintained crates: "all" | "workspace" | "transitive" | "none".
unmaintained = "all"
# How to handle crates that have been yanked from crates.io
yanked = "warn"
# A list of advisory IDs to ignore. Note that ignored advisories will still
# output a note when they are encountered.
ignore = [
    #"RUSTSEC-2020-0001",
]

[licenses]
# NOTE: `unlicensed`, `deny`, `copyleft`, `allow-osi-fsf-free`, and `default`
# used to be lint-level fields here but were all removed upstream — the
# check is now always: anything not in `allow` (or `exceptions`) below is
# denied by default. GPL-2.0/GPL-3.0/AGPL-3.0 don't need an explicit `deny`
# entry any more; simply not listing them in `allow` already denies them.
# List of explicitly allowed licenses
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
]
# The confidence threshold for detecting a license from license text (still
# a valid field — not removed by the PR#611/#681 cleanup above).
confidence-threshold = 0.8

[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "warn"
# NOTE: `deprecated` and `unmaintained` used to be valid keys here in older
# cargo-deny versions, but current cargo-deny rejects them as unknown keys
# for [bans] (that functionality moved to [advisories].unmaintained above).
# The graph highlighting used when creating dotgraphs
highlight = "all"
# List of explicitly allowed duplicate crates
allow = [
    #{ name = "ansi_term", version = "=0.11.0" },
]
# List of explicitly denied crates
deny = [
    # To deny a crate across all versions:
    # { name = "pcre2" }
    # Optionally the version can be specified as well, e.g.:
    # { name = "pcre2", version = "*" }
]

[sources]
# Lint level for what to happen when a crate from a crate registry that is not in the allow list is detected
unknown-registry = "warn"
# Lint level for what to happen when a crate from a git repository that is not in the allow list is detected
unknown-git = "warn"
# List of allowed crate registries containing allowed repositories.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# List of allowed Git repositories
allow-git = []